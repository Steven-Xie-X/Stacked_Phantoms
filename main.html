<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叠影重重</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 60%, #f1f5f9 100%);
    color: #1e293b;
    min-height: 100vh;
  }
  body {
    display: flex; justify-content: center;
    padding: 16px 12px 32px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 400px; }

  h1 {
    font-size: 21px; letter-spacing: 6px; text-align: center;
    margin: 0 0 14px; color: #1e3a8a;
    text-shadow: 0 2px 0 rgba(255,255,255,.9);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .btn {
    padding: 8px 12px; border-radius: 9px; font-size: 13px; cursor: pointer;
    border: 1px solid #cbd5e1; background: #fff; color: #1e293b;
    transition: all .15s ease; font-family: inherit;
    box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  .btn:hover { background: #f1f5f9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.toggle { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  .btn.toggle:hover { background: #d97706; }
  .btn.ghost-btn { background: #fff; color: #475569; }
  .btn.ghost-btn:hover { background: #f1f5f9; color: #1e293b; }
  .btn.answer { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .btn.answer:hover { background: #6d28d9; }
  .btn.answer.active { background: #4c1d95; border-color: #4c1d95; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #64748b; margin-bottom: 8px; padding: 0 2px;
  }
  .meta b { color: #2563eb; font-size: 13px; }

  /* ---------- 进度条 ---------- */
  .progress-row {
    display: flex; align-items: center; gap: 9px;
    margin: 0 0 10px; padding: 0 2px;
  }
  .progress-track {
    flex: 1; height: 10px; border-radius: 999px;
    background: #e2e8f0; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(15,23,42,.10);
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #60a5fa, #2563eb);
    transition: width .22s ease, background .22s ease;
  }
  .progress-fill.full {
    background: linear-gradient(90deg, #34d399, #16a34a);
  }
  .progress-label {
    font-size: 12px; font-weight: 700; color: #2563eb;
    min-width: 40px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .progress-label.full { color: #16a34a; }

  /* ---------- 棋盘 ---------- */
  #board {
    position: relative; margin: 0 auto 16px;
    background: #fff; border-radius: 8px;
    box-shadow: 0 0 0 2px #94a3b8, 0 10px 26px rgba(15,23,42,.10);
    touch-action: none; overflow: hidden;
  }
  #board.answer-mode {
    box-shadow: 0 0 0 2px #7c3aed, 0 10px 26px rgba(124,58,237,.20);
    cursor: pointer;
  }
  .cell {
    position: absolute; border: 1px solid #e2e8f0;
    transition: background-color .12s linear;
  }
  .cell.white { background: #ffffff; }
  .cell.black { background: #1e293b; }

  #piecesLayer { position: absolute; inset: 0; pointer-events: none; }
  .board-piece { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; }
  .board-piece:active { cursor: grabbing; }
  .bcell {
    position: absolute; pointer-events: none;
    border: 2px solid rgba(37,99,235,.8);
    border-radius: 5px;
    background: rgba(37,99,235,.06);
    transition: background-color .12s;
  }
  .board-piece:hover .bcell { background: rgba(37,99,235,.28); }

  /* ---------- 答案演示轮廓 ---------- */
  .answer-piece {
    position: absolute;
    pointer-events: none;
  }
  .answer-cell {
    position: absolute;
    border: 2px solid rgba(124, 58, 237, 0.65);
    border-radius: 4px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .answer-cell.latest {
    border: 3px solid #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    z-index: 5;
  }

  /* ---------- 碎片池 ---------- */
  .pool-head {
    font-size: 12px; color: #64748b; margin: 0 0 6px 2px; letter-spacing: 1px;
  }
  .pool {
    display: flex; flex-wrap: wrap; gap: 10px 8px; padding: 10px;
    background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px;
    min-height: 98px; transition: opacity .2s;
  }
  .pool.dim { opacity: .4; }
  .pool:empty::after {
    content: '碎片已全部用尽'; margin: auto;
    font-size: 13px; color: #94a3b8;
  }
  .pool-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: opacity .2s;
  }
  .pool-item.ans-done { opacity: .3; }
  .pool-slot {
    width: 78px; height: 78px; border-radius: 9px;
    background: #fff; border: 1px solid #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
  }
  .pool-piece { position: relative; cursor: pointer; touch-action: none; }
  .pool-piece:active { cursor: grabbing; }
  .pcell {
    position: absolute; background: #334155; border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .pool-tag {
    font-size: 9px; font-weight: 700; line-height: 1.3;
    color: #6d28d9; background: #f3e8ff;
    padding: 1px 5px; border-radius: 5px;
    max-width: 82px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- 拖拽幽灵 ---------- */
  .ghost {
    position: fixed; pointer-events: none; z-index: 9999;
    opacity: .88;
    filter: drop-shadow(0 8px 14px rgba(15,23,42,.35));
  }

  .tip {
    margin-top: 14px; font-size: 12px; line-height: 1.7;
    color: #64748b; background: #fff; border-radius: 10px;
    padding: 10px 12px; border: 1px solid #e2e8f0;
  }
  .tip b { color: #334155; }

  /* ---------- 成功提示 ---------- */
  .message {
    position: fixed; left: 50%; top: 38%;
    transform: translate(-50%, -50%) scale(.75);
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff; padding: 20px 34px; border-radius: 16px;
    font-size: 19px; font-weight: 700; letter-spacing: 2px;
    opacity: 0; pointer-events: none; transition: all .32s cubic-bezier(.2,.9,.3,1.4);
    z-index: 10000; box-shadow: 0 16px 40px rgba(22,163,74,.4);
  }
  .message.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div class="wrap">
  <h1>叠影重重</h1>

  <div class="controls">
    <button id="btnRandom" class="btn primary">随机生成</button>
    <button id="btnSpecify" class="btn">指定编号</button>
    <button id="btnToggle" class="btn toggle">显示目标图案</button>
    <button id="btnUndo" class="btn ghost-btn" title="撤销上一次放置">撤销上一步</button>
    <button id="btnReset" class="btn ghost-btn" title="碎片重新归位">重置盘面</button>
    <button id="btnAnswer" class="btn answer">查看答案</button>
  </div>

  <div class="meta">
    <span>挑战编号：<b id="seedShow">—</b></span>
    <span id="progress">已放置 0 / 16</span>
  </div>

  <!-- 实时匹配进度条 -->
  <div class="progress-row">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">0%</span>
  </div>

  <div id="board"></div>

  <div class="pool-head" id="poolHead">备选碎片池</div>
  <div id="pool" class="pool"></div>

  <div class="tip" id="tipBox">
    把碎片拖到上方盘面（也可拖回碎片池）· 同一格被覆盖<b>奇数次为黑</b>、<b>偶数次为白</b> ·
    用完全部 16 块碎片且盘面与目标图案完全一致即获胜<br>
    <b>单击</b>池中碎片旋转 90° · <b>连续双击</b>池中碎片左右镜像（桌面端也可右键单击镜像）<br>
    <span style="color:#7c3aed;font-weight:600;">查看答案模式下：左键点击盘面放置下一块，右键点击盘面撤回上一步。</span>
  </div>
</div>

<div id="message" class="message">🎉 作答成功！</div>

<script>
(function () {
  'use strict';

  /* ========================================================
     常量与全局状态
     ======================================================== */
  const N = 8;                 // 盘面 8 × 8
  const PIECE_COUNT = 16;      // 碎片数量
  const POOL_CELL = 14;        // 碎片池中单格像素
  const MAX_UNDO = 200;        // 撤销栈上限
  const TAP_DELAY = 280;       // 单击等待窗口（毫秒），用于区分单击/双击

  let BOARD_CELL = 44;         // 盘面单格像素（自适应）

  let pieces = [];             // 碎片数据
  let targetGrid = null;       // 目标图案（8x8 的 0/1）
  let answerPlacements = [];   // 答案摆放：每块碎片的 {cells,row,col,rot,flip}
  let showingTarget = false;   // 是否正在展示目标
  let answerMode = false;      // 是否在「查看答案」模式
  let answerIndex = 0;         // 答案演示已放置的碎片数
  let solved = false;          // 是否已通关
  let currentSeed = null;      // 当前挑战编号
  let pending = null;          // 待判定点击/拖拽
  let drag = null;             // 拖拽状态
  let undoStack = [];          // 撤销栈（状态快照）

  // 单击 / 双击 判定
  let tapTimer = null;
  let pendingRotatePiece = null;

  let cellEls = [];            // 盘面 64 个格子 DOM
  let piecesLayer = null;      // 盘面上碎片层

  /* ========================================================
     DOM
     ======================================================== */
  const boardEl       = document.getElementById('board');
  const poolEl        = document.getElementById('pool');
  const poolHead      = document.getElementById('poolHead');
  const seedShow      = document.getElementById('seedShow');
  const progressEl    = document.getElementById('progress');
  const progressFill  = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const btnRandom     = document.getElementById('btnRandom');
  const btnSpecify    = document.getElementById('btnSpecify');
  const btnToggle     = document.getElementById('btnToggle');
  const btnUndo       = document.getElementById('btnUndo');
  const btnReset      = document.getElementById('btnReset');
  const btnAnswer     = document.getElementById('btnAnswer');
  const messageEl     = document.getElementById('message');

  /* ========================================================
     随机数：固定种子 -> 可复现
     ======================================================== */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ========================================================
     随机形状（3~5 格，四连通）
     ======================================================== */
  function randomShape(rng) {
    const size = 3 + Math.floor(rng() * 3);   // 3 / 4 / 5
    const cells = [[0, 0]];
    const set = new Set(['0,0']);
    const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];

    let guard = 0;
    while (cells.length < size && guard++ < 500) {
      const base = cells[Math.floor(rng() * cells.length)];
      const d = dirs[Math.floor(rng() * 4)];
      const nr = base[0] + d[0], nc = base[1] + d[1];
      const key = nr + ',' + nc;
      if (!set.has(key)) { set.add(key); cells.push([nr, nc]); }
    }

    const minR = Math.min(...cells.map(c => c[0]));
    const minC = Math.min(...cells.map(c => c[1]));
    return cells
      .map(([r, c]) => [r - minR, c - minC])
      .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  }

  /* ========================================================
     形状变换工具
     ======================================================== */
  function normalize(cells) {
    const minR = Math.min(...cells.map(c => c[0]));
    const minC = Math.min(...cells.map(c => c[1]));
    const nc = cells.map(([r, c]) => [r - minR, c - minC]);
    nc.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    return nc;
  }

  function rotate90(cells) {
    const maxR = Math.max(...cells.map(c => c[0]));
    return normalize(cells.map(([r, c]) => [c, maxR - r]));
  }

  function mirror(cells) {
    const maxC = Math.max(...cells.map(c => c[1]));
    return normalize(cells.map(([r, c]) => [r, maxC - c]));
  }

  function applyTransform(baseCells, rot, flip) {
    let cells = baseCells.map(([r, c]) => [r, c]);
    if (flip) {
      const maxC = Math.max(...cells.map(c => c[1]));
      cells = cells.map(([r, c]) => [r, maxC - c]);
    }
    for (let i = 0; i < rot; i++) {
      const maxR = Math.max(...cells.map(c => c[0]));
      cells = cells.map(([r, c]) => [c, maxR - r]);
    }
    return normalize(cells);
  }

  function shapeSize(cells) {
    return {
      h: Math.max(...cells.map(c => c[0])) + 1,
      w: Math.max(...cells.map(c => c[1])) + 1
    };
  }

  /* ========================================================
     叠加计算：奇消偶不消（异或）
     ======================================================== */
  function computeGrid(list) {
    const g = Array.from({ length: N }, () => new Array(N).fill(0));
    for (const p of list) {
      if (!p.placed) continue;
      for (const [r, c] of p.cells) {
        const rr = p.row + r, cc = p.col + c;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) g[rr][cc] ^= 1;
      }
    }
    return g;
  }

  function computeAnswerGrid(count) {
    const g = Array.from({ length: N }, () => new Array(N).fill(0));
    const lim = Math.min(count, answerPlacements.length);
    for (let i = 0; i < lim; i++) {
      const ap = answerPlacements[i];
      for (const [r, c] of ap.cells) {
        const rr = ap.row + r, cc = ap.col + c;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) g[rr][cc] ^= 1;
      }
    }
    return g;
  }

  /* ========================================================
     状态快照（用于撤销）
     ======================================================== */
  function snapshot() {
    return pieces.map(p => ({
      placed: p.placed,
      row: p.row,
      col: p.col,
      cells: p.cells.map(c => [...c]),
      h: p.h,
      w: p.w
    }));
  }

  function restoreSnapshot(snap) {
    for (let i = 0; i < pieces.length; i++) {
      const s = snap[i];
      if (!s) continue;
      pieces[i].placed = s.placed;
      pieces[i].row = s.row;
      pieces[i].col = s.col;
      pieces[i].cells = s.cells.map(c => [...c]);
      pieces[i].h = s.h;
      pieces[i].w = s.w;
    }
  }

  function isSameState(snap) {
    if (!snap || snap.length !== pieces.length) return false;
    for (let i = 0; i < pieces.length; i++) {
      const s = snap[i], p = pieces[i];
      if (s.placed !== p.placed || s.row !== p.row || s.col !== p.col) return false;
      if (s.h !== p.h || s.w !== p.w) return false;
      if (JSON.stringify(s.cells) !== JSON.stringify(p.cells)) return false;
    }
    return true;
  }

  function pushUndo(snap) {
    if (isSameState(snap)) return;
    undoStack.push(snap);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    updateButtonStates();
  }

  /* ========================================================
     单击 / 双击 判定（碎片池专用）
     ======================================================== */
  function cancelPendingTap() {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    pendingRotatePiece = null;
  }

  function flushPendingTap() {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    const p = pendingRotatePiece;
    pendingRotatePiece = null;
    if (p && !p.placed) applyPieceTransform(p, 'rotate');
  }

  function applyPieceTransform(piece, type) {
    if (type === 'rotate') {
      piece.cells = rotate90(piece.cells);
    } else {
      piece.cells = mirror(piece.cells);
    }
    const s = shapeSize(piece.cells);
    piece.h = s.h;
    piece.w = s.w;
    renderPool();
    updateProgressText();
  }

  function handlePoolClick(piece, button) {
    // 右键：直接镜像
    if (button === 2) {
      cancelPendingTap();
      applyPieceTransform(piece, 'mirror');
      return;
    }
    // 左键：单击旋转 / 双击镜像
    if (pendingRotatePiece === piece) {
      // 在等待窗口内的第二次点击 → 双击 → 镜像
      cancelPendingTap();
      applyPieceTransform(piece, 'mirror');
      return;
    }
    // 有其他碎片正在等待单击 → 立即生效，避免丢失操作
    if (pendingRotatePiece) flushPendingTap();

    pendingRotatePiece = piece;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      tapTimer = null;
      const p = pendingRotatePiece;
      pendingRotatePiece = null;
      if (p && !p.placed) applyPieceTransform(p, 'rotate');
    }, TAP_DELAY);
  }

  /* ========================================================
     生成挑战
     ======================================================== */
  function generateChallenge(seed) {
    cancelPendingTap();
    const rng = mulberry32(seed);
    const list = [];
    const placements = [];

    for (let i = 0; i < PIECE_COUNT; i++) {
      const baseCells = randomShape(rng);
      const s0 = shapeSize(baseCells);

      const rot = Math.floor(rng() * 4);
      const flip = rng() < 0.5;
      const targetCells = applyTransform(baseCells, rot, flip);
      const st = shapeSize(targetCells);

      const row = Math.floor(rng() * (N - st.h + 1));
      const col = Math.floor(rng() * (N - st.w + 1));

      list.push({
        id: i,
        baseCells: baseCells.map(c => [...c]),
        cells: baseCells.map(c => [...c]),
        h: s0.h,
        w: s0.w,
        placed: false,
        row: 0,
        col: 0
      });

      placements.push({ cells: targetCells, row, col, rot, flip });
    }

    answerPlacements = placements;

    targetGrid = Array.from({ length: N }, () => new Array(N).fill(0));
    for (const p of placements) {
      for (const [r, c] of p.cells) {
        const rr = p.row + r, cc = p.col + c;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) targetGrid[rr][cc] ^= 1;
      }
    }

    pieces = list;
    currentSeed = seed;
    solved = false;
    showingTarget = false;
    answerMode = false;
    answerIndex = 0;
    undoStack = [];
    btnToggle.textContent = '显示目标图案';
    messageEl.classList.remove('show');
    seedShow.textContent = seed;

    renderAll();
  }

  /* ========================================================
     构建盘面骨架
     ======================================================== */
  function buildBoard() {
    boardEl.innerHTML = '';
    boardEl.style.width  = (N * BOARD_CELL) + 'px';
    boardEl.style.height = (N * BOARD_CELL) + 'px';

    cellEls = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const d = document.createElement('div');
        d.className = 'cell white';
        d.style.left   = (c * BOARD_CELL) + 'px';
        d.style.top    = (r * BOARD_CELL) + 'px';
        d.style.width  = BOARD_CELL + 'px';
        d.style.height = BOARD_CELL + 'px';
        boardEl.appendChild(d);
        cellEls.push(d);
      }
    }

    piecesLayer = document.createElement('div');
    piecesLayer.id = 'piecesLayer';
    boardEl.appendChild(piecesLayer);
  }

  /* ========================================================
     渲染
     ======================================================== */
  function renderAll() {
    renderPool();
    renderPiecesLayer();
    updateBoardView();
    updateProgressText();
    updateButtonStates();
    updateModeUI();
  }

  function updateModeUI() {
    boardEl.classList.toggle('answer-mode', answerMode);
    poolEl.classList.toggle('dim', showingTarget && !answerMode);
    poolHead.textContent = answerMode ? '备选碎片池（答案标注）' : '备选碎片池';
    btnAnswer.textContent = answerMode ? '退出查看' : '查看答案';
    btnAnswer.classList.toggle('active', answerMode);
  }

  function updateButtonStates() {
    btnUndo.disabled = answerMode || undoStack.length === 0;
    btnReset.disabled = answerMode;
    btnToggle.disabled = answerMode;
    btnRandom.disabled = false;
    btnSpecify.disabled = false;
    btnAnswer.disabled = !targetGrid;
  }

  function updateBoardView() {
    let grid, matchGrid;

    if (answerMode) {
      grid = computeAnswerGrid(answerIndex);
      matchGrid = grid;
    } else {
      const actual = computeGrid(pieces);
      grid = (showingTarget && targetGrid) ? targetGrid : actual;
      matchGrid = actual;
    }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const el = cellEls[r * N + c];
        if (!el) continue;
        const black = !!grid[r][c];
        el.classList.toggle('black', black);
        el.classList.toggle('white', !black);
      }
    }

    updateMatchBar(matchGrid);
  }

  function updateMatchBar(grid) {
    let matched = 0;
    if (targetGrid && grid) {
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (grid[r][c] === targetGrid[r][c]) matched++;
        }
      }
    }
    const pct = targetGrid ? Math.round(matched / (N * N) * 100) : 0;

    progressFill.style.width = pct + '%';
    progressLabel.textContent = pct + '%';

    const full = (pct === 100);
    progressFill.classList.toggle('full', full);
    progressLabel.classList.toggle('full', full);
  }

  function updateProgressText() {
    if (answerMode) {
      progressEl.textContent = '答案演示 ' + answerIndex + ' / ' + PIECE_COUNT;
    } else {
      const n = pieces.filter(p => p.placed).length;
      progressEl.textContent = '已放置 ' + n + ' / ' + PIECE_COUNT;
    }
  }

  function renderPool() {
    poolEl.innerHTML = '';

    for (const p of pieces) {
      if (!answerMode && p.placed) continue;

      const item = document.createElement('div');
      item.className = 'pool-item';
      if (answerMode && p.id < answerIndex) item.classList.add('ans-done');

      const slot = document.createElement('div');
      slot.className = 'pool-slot';

      const el = document.createElement('div');
      el.className = 'pool-piece';
      el.style.width  = (p.w * POOL_CELL) + 'px';
      el.style.height = (p.h * POOL_CELL) + 'px';

      for (const [r, c] of p.cells) {
        const d = document.createElement('div');
        d.className = 'pcell';
        d.style.left   = (c * POOL_CELL) + 'px';
        d.style.top    = (r * POOL_CELL) + 'px';
        d.style.width  = POOL_CELL + 'px';
        d.style.height = POOL_CELL + 'px';
        el.appendChild(d);
      }

      if (!answerMode) {
        el.addEventListener('pointerdown', ev => onPiecePointerDown(ev, p, el, 'pool'));
      }

      slot.appendChild(el);
      item.appendChild(slot);

      if (answerMode) {
        const ap = answerPlacements[p.id];
        const tag = document.createElement('div');
        tag.className = 'pool-tag';
        if (ap) {
          const rotTxt = '旋转' + ap.rot + '次';
          const flipTxt = ap.flip ? '镜像' : '无镜像';
          tag.textContent = rotTxt + '·' + flipTxt;
          tag.title = '目标：' + rotTxt + '，' + (ap.flip ? '左右镜像翻转' : '不镜像');
        } else {
          tag.textContent = '—';
        }
        item.appendChild(tag);
      }

      poolEl.appendChild(item);
    }
  }

  function renderPiecesLayer() {
    if (!piecesLayer) return;
    piecesLayer.innerHTML = '';

    if (answerMode) {
      for (let i = 0; i < answerIndex; i++) {
        const ap = answerPlacements[i];
        const w = (Math.max(...ap.cells.map(c => c[1])) + 1) * BOARD_CELL;
        const h = (Math.max(...ap.cells.map(c => c[0])) + 1) * BOARD_CELL;

        const el = document.createElement('div');
        el.className = 'answer-piece';
        el.style.left = (ap.col * BOARD_CELL) + 'px';
        el.style.top = (ap.row * BOARD_CELL) + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';

        for (const [r, c] of ap.cells) {
          const d = document.createElement('div');
          d.className = 'answer-cell';
          if (i === answerIndex - 1) d.classList.add('latest');
          d.style.left = (c * BOARD_CELL) + 'px';
          d.style.top = (r * BOARD_CELL) + 'px';
          d.style.width = BOARD_CELL + 'px';
          d.style.height = BOARD_CELL + 'px';
          el.appendChild(d);
        }
        piecesLayer.appendChild(el);
      }
      return;
    }

    if (showingTarget) return;

    for (const p of pieces) {
      if (!p.placed) continue;

      const el = document.createElement('div');
      el.className = 'board-piece';
      el.style.left   = (p.col * BOARD_CELL) + 'px';
      el.style.top    = (p.row * BOARD_CELL) + 'px';
      el.style.width  = (p.w * BOARD_CELL) + 'px';
      el.style.height = (p.h * BOARD_CELL) + 'px';

      for (const [r, c] of p.cells) {
        const d = document.createElement('div');
        d.className = 'bcell';
        d.style.left   = (c * BOARD_CELL) + 'px';
        d.style.top    = (r * BOARD_CELL) + 'px';
        d.style.width  = BOARD_CELL + 'px';
        d.style.height = BOARD_CELL + 'px';
        el.appendChild(d);
      }

      el.addEventListener('pointerdown', ev => onPiecePointerDown(ev, p, el, 'board'));
      piecesLayer.appendChild(el);
    }
  }

  /* ========================================================
     指针交互：点击 vs 拖拽
     ======================================================== */
  function onPiecePointerDown(ev, piece, el, source) {
    if (showingTarget || answerMode || solved || !targetGrid) return;
    if (ev.button !== 0 && ev.button !== 2) return;
    ev.preventDefault();

    pending = {
      piece, el, source,
      startX: ev.clientX,
      startY: ev.clientY,
      button: ev.button,
      moved: false
    };

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (drag) {
      e.preventDefault();
      moveGhost(e.clientX, e.clientY);
      return;
    }
    if (!pending) return;
    const dx = e.clientX - pending.startX;
    const dy = e.clientY - pending.startY;
    // 池中碎片放宽拖拽阈值（移动端手指抖动）
    const threshold = pending.source === 'pool' ? 100 : 49; // 10px / 7px
    if (!pending.moved && dx * dx + dy * dy > threshold) {
      pending.moved = true;
      beginDrag(e, pending.piece, pending.el, pending.source);
    }
  }

  function beginDrag(ev, piece, el, source) {
    if (drag) return;

    // 用户开始拖拽，先把未决的单击操作结算掉
    flushPendingTap();

    const rect = el.getBoundingClientRect();
    const fx = rect.width  ? (ev.clientX - rect.left) / rect.width  : 0.5;
    const fy = rect.height ? (ev.clientY - rect.top)  / rect.height : 0.5;

    const w = piece.w * BOARD_CELL;
    const h = piece.h * BOARD_CELL;

    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.style.width  = w + 'px';
    ghost.style.height = h + 'px';
    for (const [r, c] of piece.cells) {
      const d = document.createElement('div');
      d.className = 'bcell';
      d.style.left   = (c * BOARD_CELL) + 'px';
      d.style.top    = (r * BOARD_CELL) + 'px';
      d.style.width  = BOARD_CELL + 'px';
      d.style.height = BOARD_CELL + 'px';
      ghost.appendChild(d);
    }
    document.body.appendChild(ghost);

    const before = snapshot();
    const wasPlaced = piece.placed;
    const prevRow = piece.row;
    const prevCol = piece.col;

    if (piece.placed) piece.placed = false;

    drag = { piece, ghost, fx, fy, w, h, wasPlaced, prevRow, prevCol, before, source };

    renderPiecesLayer();
    updateBoardView();
    updateProgressText();
    renderPool();

    moveGhost(ev.clientX, ev.clientY);
    document.body.style.cursor = 'grabbing';
  }

  function moveGhost(cx, cy) {
    if (!drag) return;
    drag.ghost.style.left = (cx - drag.fx * drag.w) + 'px';
    drag.ghost.style.top  = (cy - drag.fy * drag.h) + 'px';
  }

  function onPointerUp(e) {
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);

    if (drag) {
      const { piece, ghost, fx, fy, w, h, wasPlaced, prevRow, prevCol, before } = drag;
      ghost.remove();
      document.body.style.cursor = '';

      const gl = e.clientX - fx * w;
      const gt = e.clientY - fy * h;

      const bRect = boardEl.getBoundingClientRect();
      const pRect = poolEl.getBoundingClientRect();
      const cx = e.clientX, cy = e.clientY;
      const centerX = gl + w / 2, centerY = gt + h / 2;

      const overBoard =
        (cx >= bRect.left && cx <= bRect.right && cy >= bRect.top && cy <= bRect.bottom) ||
        (centerX >= bRect.left && centerX <= bRect.right &&
         centerY >= bRect.top  && centerY <= bRect.bottom);

      const overPool =
        cx >= pRect.left && cx <= pRect.right && cy >= pRect.top && cy <= pRect.bottom;

      if (overBoard) {
        let col = Math.round((gl - bRect.left) / BOARD_CELL);
        let row = Math.round((gt - bRect.top)  / BOARD_CELL);
        col = Math.max(0, Math.min(N - piece.w, col));
        row = Math.max(0, Math.min(N - piece.h, row));
        piece.placed = true;
        piece.row = row;
        piece.col = col;
      } else if (overPool) {
        piece.placed = false;
      } else {
        piece.placed = wasPlaced;
        piece.row = prevRow;
        piece.col = prevCol;
      }

      pushUndo(before);
      drag = null;
      pending = null;
      renderAll();
      checkWin();

    } else if (pending) {
      const { piece, source, button, moved } = pending;
      if (!moved && source === 'pool' && !piece.placed) {
        handlePoolClick(piece, button);
      }
      pending = null;
    }
  }

  /* ========================================================
     查看答案：点击操作区域逐步放置碎片，右键撤回
     ======================================================== */
  function toggleAnswerMode() {
    if (!targetGrid) return;
    cancelPendingTap();

    answerMode = !answerMode;

    if (answerMode) {
      answerIndex = 0;
      showingTarget = false;
      btnToggle.textContent = '显示目标图案';
    }

    renderAll();
  }

  function onBoardClick() {
    if (!answerMode) return;
    if (answerIndex >= answerPlacements.length) return;

    answerIndex++;
    renderAll();
  }

  function onBoardContextMenu(e) {
    e.preventDefault();
    if (answerMode && answerIndex > 0) {
      answerIndex--;
      renderAll();
    }
  }

  /* ========================================================
     撤销 / 重置
     ======================================================== */
  function undoLast() {
    if (drag || answerMode) return;
    if (!undoStack.length) return;

    const snap = undoStack.pop();
    restoreSnapshot(snap);

    solved = false;
    messageEl.classList.remove('show');

    renderAll();
  }

  function resetBoard() {
    if (drag || answerMode || !targetGrid) return;
    cancelPendingTap();

    for (const p of pieces) {
      p.placed = false;
      p.row = 0;
      p.col = 0;
      p.cells = p.baseCells.map(c => [...c]);
      const s = shapeSize(p.cells);
      p.h = s.h;
      p.w = s.w;
    }
    undoStack = [];
    solved = false;
    messageEl.classList.remove('show');

    renderAll();
  }

  /* ========================================================
     胜利判定
     ======================================================== */
  function checkWin() {
    if (solved || !targetGrid || answerMode) return;
    if (pieces.some(p => !p.placed)) return;

    const g = computeGrid(pieces);
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (g[r][c] !== targetGrid[r][c]) return;
      }
    }

    solved = true;
    messageEl.classList.add('show');
    setTimeout(() => messageEl.classList.remove('show'), 2600);
  }

  /* ========================================================
     按钮事件
     ======================================================== */
  btnRandom.addEventListener('click', () => {
    const seed = Math.floor(Math.random() * 100000) + 1;
    generateChallenge(seed);
  });

  btnSpecify.addEventListener('click', () => {
    const input = window.prompt('请输入挑战编号（1 ~ 100000）：', currentSeed || '');
    if (input === null) return;
    const n = Number(String(input).trim());
    if (!Number.isInteger(n) || n < 1 || n > 100000) {
      window.alert('编号无效，请输入 1 ~ 100000 之间的整数。');
      return;
    }
    generateChallenge(n);
  });

  btnToggle.addEventListener('click', () => {
    if (!targetGrid || answerMode) return;
    cancelPendingTap();
    showingTarget = !showingTarget;
    btnToggle.textContent = showingTarget ? '返回操作盘面' : '显示目标图案';

    updateBoardView();
    renderPiecesLayer();
    updateModeUI();
  });

  btnUndo.addEventListener('click', undoLast);
  btnReset.addEventListener('click', resetBoard);
  btnAnswer.addEventListener('click', toggleAnswerMode);
  boardEl.addEventListener('click', onBoardClick);
  boardEl.addEventListener('contextmenu', onBoardContextMenu);

  /* ========================================================
     启动
     ======================================================== */
  function init() {
    const avail = Math.min(window.innerWidth - 36, 400);
    BOARD_CELL = Math.max(30, Math.min(44, Math.floor(avail / N)));
    buildBoard();
    renderAll();

    // 阻止池中右键菜单（棋盘已在 onBoardContextMenu 中处理）
    poolEl.addEventListener('contextmenu', e => e.preventDefault());

    // 自动生成一局
    generateChallenge(Math.floor(Math.random() * 100000) + 1);
  }

  init();
})();
</script>
</body>
</html>
